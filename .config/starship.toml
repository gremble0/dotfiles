[directory]
style = "bold blue"
truncation_length = -1
truncate_to_repo = false

[character]
success_symbol = "[❯](bold yellow)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold blue)"

[custom.nova_project]
command = "echo \"$NOVA_PROJECT\""
when = "test -n \"$NOVA_PROJECT\""
format = "configured [$output]($style) "
style = "bold green"

[custom.nova_build_preset]
command = "basename \"$NOVA_BUILD_DIR\""
when = "test -n \"$NOVA_BUILD_DIR\""
format = "preset [$output]($style) "
style = "bold yellow"

[custom.nova_worktree]
command = "echo \"$NOVA_TAG\""
when = "test -n \"$NOVA_TAG\""
format = "worktree [$output]($style) "
style = "bold cyan"

[status]
disabled = false
